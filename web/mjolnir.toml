# Conduit web client. Deploy this directory, not the repo root.
# The repo-root mjolnir.toml is the homeserver and must stay named `conduit`.
#
#   mj deploy web --name conduit-web --memory 512 \
#     --domain conduit-web.vm.worldtree.network
#   mj cert issue conduit-web.vm.worldtree.network
#
# The page calls https://conduit.vm.worldtree.network. That name is baked in
# as VITE_CONDUIT_HOMESERVER. The homeserver allows any browser origin.
# Browser SSO, once the homeserver has a client secret, also needs
# CONDUIT_SSO_REDIRECT_ALLOWLIST to include this origin. That is on the
# homeserver start command, not here.
#
# base_image is required. Omitting it deploys onto deploy-node-bun.
# `runtime` is omitted: setting it prepends a bare `mise install`, and this
# image keeps mise at /root/.local/bin. Mask serial-getty@ttyS0 or snapshot
# boot waits 90s. The `mise` step must start with `mise`. The bun step is a
# string so it copies this directory, then builds. mj deploy drops any
# directory named build, so the guest build is the one that ships.
# start_command is one line. A newline in ExecStart makes systemd reject
# the unit.

base_image = "ubuntu-24.04"
port = 8080
start_command = "export PATH=/root/.local/bin:/usr/local/bin:$PATH; exec mise exec bun@1.3.14 -- bun /app/serve.ts"
steps = [
  { run = "export PATH=/root/.local/bin:/usr/local/bin:$PATH; apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates && ln -sfn /root/.local/bin/mise /usr/local/bin/mise && ln -sfn /dev/null /etc/systemd/system/serial-getty@ttyS0.service", inputs = [] },
  "mise install bun@1.3.14",
  "export PATH=/root/.local/bin:/usr/local/bin:$PATH; export VITE_CONDUIT_HOMESERVER=https://conduit.vm.worldtree.network; mise exec bun@1.3.14 -- bun install --frozen-lockfile && mise exec bun@1.3.14 -- bun run build",
]

[build]
vcpus = 2
memory_mb = 4096
