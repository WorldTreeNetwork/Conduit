name: svelte-client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: svelte-client-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  svelte-client:
    name: Svelte client (Bun unit, static build, three browser engines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Require private dependency key
        env:
          KEY: ${{ secrets.CARGO_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::CARGO_SSH_PRIVATE_KEY is not set; identikey git dependencies cannot be fetched"
            exit 1
          fi
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CARGO_SSH_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> web/.cache/cargo"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Install browser engines
        run: bun --bun x playwright install --with-deps chromium firefox webkit
      - name: Playwright journeys (real binary, fresh database, static client)
        run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svelte-client-e2e-report
          path: |
            web/playwright-report
            web/test-results
