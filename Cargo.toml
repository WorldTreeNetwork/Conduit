[workspace]
members = ["conduit", "conduit-server"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Conduit contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
iroh = { version = "1.0.0-rc.0", default-features = false, features = ["tls-ring"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
infer = "0.16"
tempfile = "3"
serde_yaml = "0.9"
regex = "1"
# Agency tokens (identikey-capability-v1 format). Apache-2.0.
biscuit-auth = "6"
# Identity challenge/response from identikey-protocol.
# Apache-2.0 OR BSD-2-Clause-Patent.  identikey-core (AGPL) is NOT a
# dependency and must never become one — the host speaks OIDC to it.
identikey-auth = { git = "ssh://git@github.com/identikey/identikey-protocol.git", rev = "303dff1819aaba4f7a53f38b0fbc5a785a2743db" }
# RP JWT/JWKS client. Apache-2.0 OR BSD-2-Clause-Patent. Not identikey-oidc (the AGPL OP).
identikey-oidc-client = { git = "ssh://git@github.com/identikey/identikey-core.git", rev = "5d5c72eccb22c0630320c1a1c534a1c45d419313" }
